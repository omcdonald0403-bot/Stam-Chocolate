<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chocolaterie Stam advertising page.">
  <title>Chocolaterie Stam | Ads</title>
  <style>
    :root {
      --gold: #d4af37;
      --cream: #fdf8f2;
      --chocolate-dark: #2c1a14;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--chocolate-dark);
      background: var(--cream);
      font-family: Georgia, 'Times New Roman', serif;
    }
    nav {
      padding: 18px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: var(--chocolate-dark);
      font-family: Arial, Helvetica, sans-serif;
    }
    nav a { color: var(--white); text-decoration: none; font-weight: bold; }
    nav a:hover, nav a:focus-visible { color: var(--gold); }
    .logo { font-size: 22px; letter-spacing: 1px; }
    .ad-page { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 36px 0 64px; }
    h1 { margin: 0 0 30px; text-align: center; font-size: clamp(30px, 5vw, 48px); }
    .leaderboard { display: flex; justify-content: center; margin: 0 auto 44px; }
    .ad-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      align-items: start;
      justify-content: center;
      gap: 32px;
    }
    .content-ads { display: grid; grid-template-columns: 300px 160px; align-items: start; justify-content: center; gap: 24px; }
    .ad-link { display: block; width: fit-content; max-width: 100%; line-height: 0; }
    .ad-link img { display: block; height: auto; max-width: 100%; }
    .leaderboard img { width: 728px; }
    .medium img { width: 300px; }
    .skyscraper img { width: 160px; }
    .half-page img { width: 300px; }
    .ad-link:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
    @media (max-width: 760px) {
      nav { flex-direction: column; }
      .ad-layout { grid-template-columns: 1fr; }
      .content-ads { grid-template-columns: minmax(0, 300px) minmax(0, 160px); }
      .half-page { justify-self: center; }
    }
    @media (max-width: 520px) {
      .content-ads { grid-template-columns: 1fr; justify-items: center; }
      .leaderboard img, .medium img, .skyscraper img, .half-page img { width: 100%; height: auto; }
      .leaderboard .ad-link, .medium .ad-link, .skyscraper .ad-link, .half-page .ad-link { width: 100%; }
    }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a class="logo" href="index.html">CHOCOLATERIE STAM</a>
    <a href="index.html">HOME</a>
  </nav>

  <main class="ad-page">
    <h1>AD PAGE</h1>

    <div class="leaderboard">
      <a class="ad-link" href="landing.html" aria-label="Open the Harvest Collection offer">
        <img src="stam-728x90.png" width="728" height="90" alt="Chocolaterie Stam Harvest Collection leaderboard advertisement">
      </a>
    </div>

    <div class="ad-layout">
      <div class="content-ads">
        <div class="medium">
          <a class="ad-link" href="landing.html" aria-label="Open the Harvest Collection offer">
            <img src="stam-300x250.png" width="300" height="250" alt="Chocolaterie Stam Harvest Collection medium rectangle advertisement" loading="lazy">
          </a>
        </div>
        <div class="skyscraper">
          <a class="ad-link" href="landing.html" aria-label="Open the Harvest Collection offer">
            <img src="stam-160x600.png" width="160" height="600" alt="Chocolaterie Stam Harvest Collection skyscraper advertisement" loading="lazy">
          </a>
        </div>
      </div>
      <div class="half-page">
        <a class="ad-link" href="landing.html" aria-label="Open the Harvest Collection offer">
          <img src="stam-300x600.png" width="300" height="600" alt="Chocolaterie Stam Harvest Collection half-page advertisement" loading="lazy">
        </a>
      </div>
    </div>
  </main>
</body>
</html>
