      <path d="M112 44 C95 57, 91 71, 96 94 C81 98, 72 110, 77 128 C90 144, 116 144, 133 128 C145 115, 146 101, 137 88 C146 71, 145 56, 130 46 C123 42, 116 41, 112 44Z" fill="#5a1d1d"/>
